$kind: http-request
method: GET
url: '{{base_url}}/admin/dashboard'
order: 3000
settings:
  followRedirects: false
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Akses tanpa autentikasi ditolak', function () {
        pm.expect([302, 401, 403]).to.include(pm.response.code);
      });
      pm.test('Perilaku web app umumnya redirect ke login', function () {
        if (pm.response.code === 302) {
          const location = pm.response.headers.get('Location') || '';
          pm.expect(location).to.include('/login');
        }
      });
