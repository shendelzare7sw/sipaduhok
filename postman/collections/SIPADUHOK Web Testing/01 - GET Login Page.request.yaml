$kind: http-request
method: GET
url: '{{base_url}}/login'
order: 1000
settings:
  followRedirects: false
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('GET /login mengembalikan halaman login', function () {
        pm.expect(pm.response.code).to.eql(200);
      });
      pm.test('Respons berupa HTML', function () {
        pm.expect(pm.response.text()).to.include('<');
      });
