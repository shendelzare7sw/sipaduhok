$kind: http-request
method: POST
url: '{{base_url}}/login'
order: 2000
headers:
  - key: Content-Type
    value: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    - key: email
      value: 'invalid@example.com'
    - key: password
      value: 'salah'
settings:
  followRedirects: false
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // POST tanpa token CSRF ditolak lebih dulu oleh middleware VerifyCsrfToken.
      // Aplikasi mengubah error 419 menjadi redirect (302) + pesan "Sesi kedaluwarsa"
      // (lihat handler di bootstrap/app.php), jadi 302 adalah hasil yang benar di sini.
      pm.test('POST /login tanpa CSRF / kredensial salah tidak boleh sukses', function () {
        pm.expect([302, 419, 422]).to.include(pm.response.code);
      });
      pm.test('Tidak login & tidak mengembalikan sesi (bukan 200/201)', function () {
        pm.expect([200, 201]).to.not.include(pm.response.code);
      });
